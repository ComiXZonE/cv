{% assign tools = site.data.data.tools %}
{% if tools %}
<div class="tools-container container-block">

  <h2 class="container-block-title">
    {{ tools.title }}
  </h2>

  <ul class="list-unstyled interests-list">
    {% for tool in tools.toolset %}
    <li>
      {% if tool.category %}<span class="tool-category">{{ tool.category }}</span>{% endif %}
      {{ tool.name }}
    </li>
    {% endfor %}
  </ul>

</div><!--//tools-->
{% endif %}
